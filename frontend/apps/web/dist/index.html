<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>doska — мои задачи</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #10141c;
      --foreground: #e6e9ef;
      --muted: #8a93a6;
      --card: #171d29;
      --border: #263041;
      --accent: #4f8cff;
      --danger: #ff6b6b;
    }
    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: system-ui, sans-serif;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 16px;
      align-items: baseline;
    }
    header a { color: var(--accent); cursor: pointer; }
    #view { padding: 16px 20px; }
    input, select, textarea, button {
      background: var(--card);
      color: var(--foreground);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font: inherit;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
    button.danger { border-color: var(--danger); color: var(--danger); cursor: pointer; }
    .error { color: var(--danger); margin-top: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <strong>doska</strong>
    <a id="nav-mine">мои задачи</a>
    <span id="who"></span>
    <span style="margin-left:auto"></span>
    <button id="logout" title="забыть токен">выйти</button>
  </header>
  <div id="view">загрузка…</div>
  <script type="module" src="./app.js"></script>
</body>
</html>
